version: 2
updates:
  # Keeps the commit-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # NuGet packages (one grouped PR for the test packages).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      test-packages:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*"]
